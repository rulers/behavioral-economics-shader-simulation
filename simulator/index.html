<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3ed" />
    <title>Field Notes / Simulations</title>
    <link rel="stylesheet" href="lifegame-simple/style.css" />
    <link rel="stylesheet" href="catalog.css" />
  </head>
  <body>
    <main class="app-shell catalog-shell">
      <header class="topbar">
        <a class="wordmark" href="./index.html" aria-label="シミュレーター一覧">
          <span class="wordmark-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>FIELD NOTES <b> / INDEX</b></span>
        </a>
        <span class="topbar-note"><span class="status-dot"></span> SIMULATION ARCHIVE</span>
      </header>

      <section class="catalog-intro" aria-labelledby="page-title">
        <p class="eyebrow">SMALL WORLDS, OPEN QUESTIONS</p>
        <h1 id="page-title">シミュレーション<br /><span>一覧</span></h1>
        <p class="intro-copy">ルールから生まれるパターンを、動かして観察する。</p>
      </section>

      <section class="catalog-section" aria-labelledby="available-title">
        <div class="catalog-heading">
          <h2 id="available-title">AVAILABLE SIMULATIONS</h2>
          <span>01</span>
        </div>
        <article class="simulation-item">
          <div class="pattern-preview" aria-hidden="true">
            <i class="preview-cell cell-one"></i>
            <i class="preview-cell cell-two"></i>
            <i class="preview-cell cell-three"></i>
            <i class="preview-cell cell-four"></i>
            <i class="preview-cell cell-five"></i>
          </div>
          <div class="simulation-copy">
            <p class="simulation-number">01 / CELLULAR AUTOMATON</p>
            <h3>ライフゲーム</h3>
            <p>近傍8セルのルールから、移動・増殖・消滅するパターンを観察します。</p>
          </div>
          <a class="launch-link" href="./lifegame-simple/">シミュレーションを開く <span aria-hidden="true">↗</span></a>
        </article>
      </section>

      <footer class="catalog-footer">
        <span>FIELD NOTES / SIMULATION ARCHIVE</span>
        <span>AVAILABLE · 01</span>
      </footer>
    </main>
  </body>
</html>
