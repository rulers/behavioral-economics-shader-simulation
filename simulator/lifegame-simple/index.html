<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f3ed" />
    <title>Life / Simple Simulator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="../index.html" aria-label="シミュレーター一覧に戻る">
          <span class="wordmark-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>FIELD NOTES <b> / 01</b></span>
        </a>
        <span class="topbar-note"><span class="status-dot"></span> CONWAY'S GAME OF LIFE</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A SMALL WORLD, ONE RULE AT A TIME</p>
        <h1 id="page-title">ライフゲーム<br /><span>シミュレーション</span></h1>
        <!-- <p class="intro-copy">生きるか、消えるか。近傍の8マスだけで決まる、小さな世界のルール。</p> -->
      </section>

      <section class="workspace" aria-label="ライフゲーム">
        <div class="board-heading">
          <div>
            <span class="section-label">SIMULATION FIELD</span>
            <h2>フィールド <span>60 × 36</span></h2>
          </div>
          <div class="generation" aria-live="polite">
            <span class="section-label">GENERATION</span>
            <strong id="generation">0000</strong>
          </div>
        </div>

        <div class="canvas-frame">
          <canvas id="field" aria-label="セルをクリックして生死を切り替えるゲーム盤"></canvas>
          <div class="canvas-corner" aria-hidden="true">クリックしてセルを編集</div>
        </div>

        <div class="board-footer">
          <div class="population"><span class="population-dot"></span><span>生存セル</span><strong id="population">0</strong></div>
          <span class="boundary-note">境界: 盤外はすべて死亡</span>
        </div>

        <div class="preset-controls" aria-label="パターンサンプル">
          <label class="section-label" for="preset-select">PATTERN SAMPLES</label>
          <select id="preset-select">
            <option value="" selected>サンプルを選択</option>
            <option value="glider">グライダー · 移動パターン</option>
            <option value="r-pentomino">Rペントミノ · 複雑な成長</option>
            <option value="gosper-gun">Gosper銃 · グライダーを生成</option>
            <option value="sierpinski">Sierpinski型 · フラクタル初期配置</option>
          </select>
          <button id="load-preset-button" class="button button-secondary" type="button" disabled>盤面に配置</button>
          <p id="preset-description" aria-live="polite">パターンを選ぶと説明が表示されます。</p>
        </div>

        <div class="controls" aria-label="シミュレーション操作">
          <div class="transport">
            <button id="toggle-button" class="button button-primary" type="button" aria-label="再生">
              <span id="toggle-icon" aria-hidden="true">▶</span><span id="toggle-label">再生</span>
            </button>
            <button id="step-button" class="button button-secondary" type="button" aria-label="1世代進める">
              <span aria-hidden="true">＋</span> 1ステップ
            </button>
          </div>
          <div class="edit-controls">
            <button id="random-button" class="button button-quiet" type="button"><span aria-hidden="true">⤨</span> ランダム</button>
            <button id="clear-button" class="button button-quiet" type="button"><span aria-hidden="true">×</span> クリア</button>
          </div>
          <label class="speed-control" for="speed">
            <span>スピード</span>
            <input id="speed" type="range" min="1" max="10" value="5" />
            <strong id="speed-value">5</strong>
          </label>
        </div>
      </section>

      <footer class="page-footer">
        <span>CONWAY'S GAME OF LIFE</span>
        <span>誕生: 近傍3 · 生存: 近傍2〜3</span>
      </footer>
    </main>
  </body>
</html>
